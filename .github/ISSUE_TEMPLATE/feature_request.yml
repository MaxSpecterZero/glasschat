name: Feature request
description: Suggest an idea, theme or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the workflow you want to be easier.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Glasschat help? Mock-ups welcome (no real chats please).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
